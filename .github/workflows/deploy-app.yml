name: Deploy app

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: app-deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ZIP package to Azure App Service
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: Build deployment package
        run: |
          python -m pip install --upgrade pip
          python -m pip install --target app/.python_packages/lib/site-packages -r app/requirements.txt
          cd app
          zip -qr ../app.zip . -x 'test_app.py' '__pycache__/*' '*.pyc'
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy package
        run: >-
          az webapp deploy
          --resource-group "${{ vars.APP_RESOURCE_GROUP }}"
          --name "${{ vars.APP_SERVICE_NAME }}"
          --src-path app.zip
          --type zip
