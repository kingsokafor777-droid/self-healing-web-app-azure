name: Deploy app
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: app-deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    name: Test and deploy ZIP package to Azure App Service
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: Validate required GitHub variables
        shell: bash
        env:
          AZURE_DEPLOY_CLIENT_ID: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          APP_RESOURCE_GROUP: ${{ vars.APP_RESOURCE_GROUP }}
          APP_SERVICE_NAME: ${{ vars.APP_SERVICE_NAME }}
        run: |
          set -euo pipefail
          for name in AZURE_DEPLOY_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID APP_RESOURCE_GROUP APP_SERVICE_NAME; do
            if [[ -z "${!name:-}" ]]; then echo "Missing repository variable: $name" >&2; exit 1; fi
          done
      - name: Install, audit, and test the app
        working-directory: app
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pip-audit
          pip-audit -r requirements.txt
          python -m unittest -v
      - name: Build source ZIP for Azure Oryx
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/app-package"
          rm -rf "$package_dir"
          mkdir -p "$package_dir"
          cp app/app.py app/requirements.txt "$package_dir/"
          (cd "$package_dir" && zip -qr "$GITHUB_WORKSPACE/app.zip" .)
      - name: Sign in with the deploy-only Azure identity
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Verify Azure CLI Entra deployment support
        shell: bash
        run: |
          set -euo pipefail
          version="$(az version --query '"azure-cli"' -o tsv)"
          IFS=. read -r major minor patch <<< "$version"
          patch="${patch%%[!0-9]*}"
          if (( major < 2 || (major == 2 && minor < 48) || (major == 2 && minor == 48 && patch < 1) )); then
            echo "Azure CLI 2.48.1 or newer is required for Entra-authenticated App Service ZIP deployment; found $version." >&2
            exit 1
          fi
          echo "Azure CLI $version supports Microsoft Entra deployment."
      - name: Deploy package
        env:
          APP_RESOURCE_GROUP: ${{ vars.APP_RESOURCE_GROUP }}
          APP_SERVICE_NAME: ${{ vars.APP_SERVICE_NAME }}
        run: az webapp deploy --resource-group "$APP_RESOURCE_GROUP" --name "$APP_SERVICE_NAME" --src-path app.zip --type zip
